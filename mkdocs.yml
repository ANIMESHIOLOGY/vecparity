site_name: vecparity
site_url: https://animeshiology.github.io/vecparity/
repo_url: https://github.com/ANIMESHIOLOGY/vecparity
repo_name: ANIMESHIOLOGY/vecparity
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/vecparity_logo.png
  favicon: assets/vecparity_logo.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: blue
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.integrate
    - content.code.copy
    - content.tooltips
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ANIMESHIOLOGY/vecparity
      name: vecparity on GitHub

plugins:
  - search
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - tables

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - Backends: backends.md
  - Cutover Workflow: cutover.md
  - Design Principles: design-principles.md
  - API Reference:
      - adapters: api-reference/adapters.md
      - sync: api-reference/sync.md
      - verify: api-reference/verify.md
      - types: api-reference/types.md
