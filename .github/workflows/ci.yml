name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -e ".[all,dev]"

      - name: Run ruff
        run: ruff check vecparity/ tests/

      - name: Run black (check only)
        run: black --check vecparity/ tests/

      - name: Run mypy
        run: mypy vecparity/

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/ -v --cov=vecparity --cov-report=xml -m "not integration" --ignore=tests/integration

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  integration:
    name: Integration Tests (all backends)
    runs-on: ubuntu-latest
    # Milvus needs etcd + minio started first, in that dependency order,
    # which GitHub Actions' native `services:` block can't express (it
    # starts every service in parallel with no depends_on support). Using
    # docker-compose.test.yml directly here also means there's exactly one
    # place — not two divergent YAML definitions — describing how to stand
    # up the test backends, same file contributors use locally.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[all,dev]"

      - name: Start test backends
        # Retries on a transient Docker networking race seen on shared
        # runners: "failed to bind host port ... address already in use"
        # for a port nothing else in this job actually uses — a
        # docker-proxy port-binding flake, not a real conflict (every
        # other service in the same `up` call started fine). A clean
        # `down -v` + retry clears it.
        run: |
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.test.yml up -d --wait; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying after cleanup..."
            docker compose -f docker-compose.test.yml down -v
            sleep 5
          done
          exit 1

      - name: Run integration tests
        run: pytest tests/integration/ -v -m integration
        env:
          VECPARITY_TEST_PGVECTOR_DSN: postgresql://postgres:postgres@localhost:55432/vecparity_test
          VECPARITY_TEST_QDRANT_URL: http://localhost:56333
          VECPARITY_TEST_WEAVIATE_HOST: localhost
          VECPARITY_TEST_WEAVIATE_PORT: "58080"
          VECPARITY_TEST_WEAVIATE_GRPC_PORT: "58051"
          VECPARITY_TEST_CHROMA_HOST: localhost
          VECPARITY_TEST_CHROMA_PORT: "58000"
          VECPARITY_TEST_MILVUS_URI: http://localhost:59530

      - name: Tear down test backends
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
