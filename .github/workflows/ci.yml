name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -e ".[all,dev]"

      - name: Run ruff
        run: ruff check vecparity/ tests/

      - name: Run black (check only)
        run: black --check vecparity/ tests/

      - name: Run mypy
        run: mypy vecparity/

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/ -v --cov=vecparity --cov-report=xml -m "not integration" --ignore=tests/integration

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  integration:
    name: Integration Tests (pgvector + Qdrant)
    runs-on: ubuntu-latest
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vecparity_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 56333:6333

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[pgvector,qdrant,dev]"

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:56333/readyz && break
            sleep 2
          done

      - name: Run integration tests
        run: pytest tests/integration/ -v -m integration
        env:
          VECPARITY_TEST_PGVECTOR_DSN: postgresql://postgres:postgres@localhost:55432/vecparity_test
          VECPARITY_TEST_QDRANT_URL: http://localhost:56333
