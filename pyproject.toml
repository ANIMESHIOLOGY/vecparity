[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vecparity"
version = "0.1.0"
description = "Live, quality-verified migration between vector databases: proves retrieval quality survived the switch before you cut over."
authors = [{ name = "Animesh" }]
license = { file = "LICENSE" }
readme = "README.md"
# PEP 604 unions need real interpreter support (3.10+); Python 3.9 is also EOL.
requires-python = ">=3.10"
keywords = ["vector-database", "migration", "rag", "pgvector", "qdrant", "pinecone", "embeddings", "retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
pgvector = ["psycopg[binary]>=3.1.0", "pgvector>=0.2.0"]
qdrant = ["qdrant-client>=1.9.0"]
pinecone = ["pinecone>=5.0.0"]
milvus = ["pymilvus>=2.4.0"]
weaviate = ["weaviate-client>=4.5.0"]
chroma = ["chromadb>=0.5.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
]
all = [
    "vecparity[pgvector,qdrant,pinecone,milvus,weaviate,chroma]",
]

[project.scripts]
vecparity = "vecparity.cli:app"

[project.urls]
Homepage = "https://github.com/ANIMESHIOLOGY/vecparity"
Repository = "https://github.com/ANIMESHIOLOGY/vecparity"
"Bug Tracker" = "https://github.com/ANIMESHIOLOGY/vecparity/issues"

[tool.hatch.build.targets.wheel]
packages = ["vecparity"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "E501"]
# typer.Option(...) as a default is the required Typer pattern, not B008.
"vecparity/cli.py" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
# 3.12 for mypy's own syntax parsing; numpy's stubs need it.
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
exclude = ["tests/", "build/", "dist/"]
# NOT no_site_packages=true: that would block resolving pydantic itself.

[[tool.mypy.overrides]]
# Typer's @app.command() decorator has no strict-mode-friendly type stubs.
module = "vecparity.cli"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests as integration tests (require docker)",
]
addopts = "--cov=vecparity --cov-report=term-missing"

[tool.coverage.run]
source = ["vecparity"]
omit = ["tests/*"]
